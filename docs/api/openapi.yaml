openapi: 3.0.3
info:
  title: Personal Finance App API
  description: API for personal finance management inspired by Mobills and similar apps.
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production

paths:
  /accounts:
    get:
      summary: List user accounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
    post:
      summary: Create a new account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Account created

  /transactions:
    get:
      summary: List transactions with filters
      security:
        - bearerAuth: []
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
    post:
      summary: Create a transaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreate'
      responses:
        '201':
          description: Transaction created

  /budgets:
    get:
      summary: List budgets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of budgets
    post:
      summary: Create a budget
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCreate'
      responses:
        '201':
          description: Budget created

  /goals:
    get:
      summary: List financial goals
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of goals
    post:
      summary: Create a goal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreate'
      responses:
        '201':
          description: Goal created

  /open-finance/connect:
    post:
      summary: Initiate Open Finance connection
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Widget token or redirect URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  widget_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [checking, savings, credit_card, cash, investment]
        balance:
          type: number
          format: decimal
        currency:
          type: string
    AccountCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        initial_balance:
          type: number
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: number
        type:
          type: string
        description:
          type: string
        transaction_date:
          type: string
          format: date
        category_id:
          type: string
          format: uuid
    TransactionCreate:
      type: object
      required: [account_id, amount, type, transaction_date]
      properties:
        account_id:
          type: string
          format: uuid
        amount:
          type: number
        type:
          type: string
        description:
          type: string
        category_id:
          type: string
          format: uuid
        transaction_date:
          type: string
          format: date
    BudgetCreate:
      type: object
      properties:
        name:
          type: string
        period_start:
          type: string
          format: date
        total_limit:
          type: number
    GoalCreate:
      type: object
      required: [name, target_amount]
      properties:
        name:
          type: string
        target_amount:
          type: number
        target_date:
          type: string
          format: date
